name: US Stock Catalyst 24x7 Cloud Monitor

on:
  schedule:
    # 7x24 小时全天候每 15 分钟兜底唤醒（配合脚本内 14 分钟常驻流式轮询 + 自动接力 workflow_dispatch）
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: us-stock-catalyst-monitor-singleton
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lightweight dependencies
        run: pip install --quiet pypdf pymupdf

      - name: Run Real-Time SEC, Gmail IMAP, Media & Vault Sync
        env:
          GSHEETS_TOKEN_JSON: ${{ secrets.GSHEETS_TOKEN_JSON }}
          SPREADSHEET_ID: '1pIKfEy9UNPs32W5gBFJu3N5doqU-SKCvIBDjX-TMwGQ'
          MONITOR_DURATION_MINUTES: '14'
          SYNC_DRIVE_VAULT: '1'
        run: python monitor.py
